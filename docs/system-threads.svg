<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title desc">
<title id="title">Simple workflow and CPU scheduling</title><desc id="desc">Camera, detection, recognition, main, web and save work use separate software threads on Pi 5. Linux shares four CPU cores among runnable threads. Pico is a separate board receiving servo angles and approval commands.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#486581"/></marker></defs>
<rect width="960" height="1080" rx="16" fill="#f5f8fc"/>
<g font-family="Arial,sans-serif" fill="#102a43">
<text x="32" y="45" font-size="28" font-weight="700">HOW THE PROJECT WORKS</text>
<text x="32" y="78" font-size="19">Threads divide the jobs. Linux chooses the CPU cores.</text>
<text x="32" y="125" font-size="22" font-weight="700">1. WORKFLOW</text>
<g fill="#e7f0ff" stroke="#acc6e8">
<rect x="32" y="155" width="260" height="100" rx="12"/><rect x="350" y="155" width="260" height="100" rx="12"/><rect x="668" y="155" width="260" height="100" rx="12"/>
<rect x="32" y="330" width="410" height="110" rx="12"/><rect x="518" y="330" width="410" height="110" rx="12"/>
<rect x="518" y="510" width="410" height="110" rx="12"/>
</g>
<rect x="32" y="510" width="410" height="110" rx="12" fill="#e5f5eb" stroke="#9bc9af"/>
<g font-size="22" font-weight="700"><text x="50" y="188">Capture thread</text><text x="368" y="188">Detection thread</text><text x="686" y="188">Recognition thread</text><text x="50" y="364">Main thread</text><text x="536" y="364">Web threads</text><text x="536" y="544">Save worker</text><text x="50" y="544">Pico (separate board)</text></g>
<g font-size="19"><text x="50" y="219">Read the camera</text><text x="368" y="219">YOLO finds faces</text><text x="686" y="219">YuNet + SFace</text><text x="686" y="244">Check the owner</text>
<text x="50" y="395">Track face + update display</text><text x="50" y="423">Check Unlock conditions</text><text x="536" y="395">Show live images</text><text x="536" y="423">Receive the Unlock click</text>
<text x="536" y="576">Save image to MongoDB</text><text x="536" y="604">Then send APPROVED</text><text x="50" y="576">Receive UART commands</text><text x="50" y="604">Control servos + approval LED</text></g>
<g fill="none" stroke="#486581" stroke-width="2.5" marker-end="url(#a)"><path d="M292 205 H344"/><path d="M610 205 H662"/><path d="M480 255 V289 H237 V324"/><path d="M798 255 V305 H410 V324"/><path d="M518 385 H448"/><path d="M237 440 V504"/><path d="M442 420 H480 V479 H723 V504"/><path d="M518 570 H448"/></g>
<g font-size="16" fill="#334e68"><text x="251" y="282">Face positions</text><text x="644" y="298">Owner status</text><text x="244" y="485">Servo angles</text><text x="529" y="469">Allowed request</text></g>
<text x="32" y="657" font-size="18">Blue boxes: Pi 5 software threads. Green box: Pico runs its own single loop.</text>
<path d="M32 688 H928" stroke="#c8d5e4"/>
<text x="32" y="731" font-size="22" font-weight="700">2. HOW PI 5 RUNS THE THREADS ABOVE</text>
<text x="32" y="765" font-size="19">Capture / Detection / Recognition / Main / Web / Save</text>
<rect x="150" y="791" width="660" height="69" rx="12" fill="#dbeafe" stroke="#acc6e8"/>
<text x="480" y="821" text-anchor="middle" font-size="23" font-weight="700">Linux chooses who runs next</text><text x="480" y="846" text-anchor="middle" font-size="18">Ready threads get CPU time; waiting threads give way.</text>
<g fill="none" stroke="#486581" stroke-width="2.5"><path d="M480 860 V888 H140 V910 M480 888 H820 V910 M367 888 V910 M593 888 V910"/></g>
<g fill="#fff" stroke="#acc6e8"><rect x="50" y="910" width="180" height="60" rx="10"/><rect x="277" y="910" width="180" height="60" rx="10"/><rect x="503" y="910" width="180" height="60" rx="10"/><rect x="730" y="910" width="180" height="60" rx="10"/></g>
<g text-anchor="middle" font-size="23" font-weight="700"><text x="140" y="948">Core 0</text><text x="367" y="948">Core 1</text><text x="593" y="948">Core 2</text><text x="820" y="948">Core 3</text></g>
<text x="480" y="1008" text-anchor="middle" font-size="21" font-weight="700">No job has its own fixed core.</text><text x="480" y="1041" text-anchor="middle" font-size="18">OpenCV and PyTorch can also create calculation threads.</text>
</g></svg>
