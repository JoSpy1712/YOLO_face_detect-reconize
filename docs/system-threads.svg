<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">Face tracking: threads, CPU scheduling and Pico control</title>
<desc id="desc">Pi 5 uses capture, detection, recognition, HTTP and database worker threads. Linux schedules them across available cores with no fixed affinity. Pico uses one MicroPython loop and hardware PWM; core 1 is not explicitly used.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#486581" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1080" rx="18" fill="#f4f7fc"/>
<g font-family="Arial, sans-serif" fill="#102a43">
<text x="40" y="43" font-size="27" font-weight="700">FACE RECOGNITION &amp; PAN-TILT TRACKING</text>
<text x="40" y="71" font-size="16" fill="#486581">Execution architecture from the submitted Python and MicroPython source</text>
<rect x="25" y="95" width="1030" height="720" rx="16" fill="#eaf2ff" stroke="#9cbce8"/>
<text x="48" y="130" font-size="23" font-weight="700">Raspberry Pi 5 | one application process</text>
<text x="48" y="157" font-size="16" fill="#334e68">Linux schedules runnable threads across available CPU cores; no thread-to-core pinning.</text>
<g fill="#fff" stroke="#aac4e6" stroke-width="1.5">
<rect x="48" y="183" width="290" height="110" rx="10"/>
<rect x="395" y="183" width="290" height="110" rx="10"/>
<rect x="742" y="183" width="290" height="110" rx="10"/>
<rect x="48" y="337" width="984" height="64" rx="10" fill="#d6e7ff"/>
<rect x="48" y="451" width="290" height="160" rx="10"/>
<rect x="395" y="451" width="290" height="160" rx="10"/>
<rect x="742" y="451" width="290" height="160" rx="10"/>
</g>
<g font-size="19" font-weight="700">
<text x="65" y="213">1. Capture thread</text><text x="412" y="213">2. YOLO detection</text><text x="759" y="213">3. Recognition thread</text>
<text x="65" y="482">Main thread</text><text x="412" y="482">Web server + handlers</text><text x="759" y="482">Unlock worker (max 1)</text>
</g>
<g font-size="16" fill="#334e68">
<text x="65" y="242">Read USB camera continuously</text><text x="65" y="267">Publish only the latest frame</text>
<text x="412" y="242">Infer on a new frame ID</text><text x="412" y="267">Publish boxes + source image</text>
<text x="759" y="242">One face: YuNet + SFace</text><text x="759" y="267">Enrollment / identity status</text>
<text x="65" y="510">Track face; send UART state</text><text x="65" y="536">Desktop UI + JPEG publication</text><text x="65" y="562">Recheck approval conditions</text><text x="65" y="588">Poll Future without waiting</text>
<text x="412" y="510">Serve MJPEG and status</text><text x="412" y="536">Queue operator Unlock request</text><text x="412" y="562">Condition + queue(maxsize=1)</text><text x="412" y="588">Disabled by --no-web</text>
<text x="759" y="510">MongoDB: JPEG + timestamp</text><text x="759" y="536">Then transmit APPROVED</text><text x="759" y="562">Save failure: no approval</text><text x="759" y="588">UART writes share a lock</text>
</g>
<text x="69" y="365" font-size="18" font-weight="700">Shared snapshots protected by state_lock</text>
<text x="69" y="388" font-size="15" fill="#334e68">Latest frame / detection / authorization; frame IDs avoid reprocessing the same image.</text>
<g fill="none" stroke="#486581" stroke-width="2" marker-end="url(#arrow)">
<path d="M338 237 H390"/><path d="M685 237 H737"/>
<path d="M193 293 V331"/><path d="M540 293 V331"/><path d="M887 293 V331"/>
<path d="M193 401 V445"/><path d="M540 451 V407"/><path d="M887 401 V445"/>
</g>
<text x="67" y="640" font-size="15" fill="#334e68">Web request queue → main-thread recheck → single unlock worker. Browser handlers do not grant approval.</text>
<rect x="48" y="662" width="984" height="124" rx="10" fill="#fff" stroke="#aac4e6"/>
<text x="67" y="690" font-size="18" font-weight="700">CPU scheduling and native inference workers</text>
<text x="67" y="717" font-size="16">N = CPUs allowed by the process affinity mask (fallback: os.cpu_count() or 1).</text>
<text x="67" y="743" font-size="16">OpenCV threads = N | PyTorch intra-op threads = N | PyTorch inter-op threads = 1.</text>
<text x="67" y="769" font-size="16">These are library thread settings, not reserved cores or guaranteed simultaneous execution.</text>
<path d="M193 815 V849" fill="none" stroke="#486581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="214" y="838" font-size="16" font-weight="700">UART 115200 baud | STATE at most ~20 Hz + APPROVED</text>
<rect x="25" y="860" width="1030" height="190" rx="16" fill="#e7f5ed" stroke="#9bc9af"/>
<text x="48" y="895" font-size="23" font-weight="700">Raspberry Pi Pico | one MicroPython loop on core 0</text>
<text x="48" y="926" font-size="17">UART0 GP0 TX / GP1 RX → validate packet → update GP2 pan + GP3 tilt</text>
<text x="48" y="954" font-size="17">Hardware PWM at 50 Hz | approval LED timeout | diagnostics | sleep_ms(2)</text>
<text x="48" y="982" font-size="17">Core 1: no application task is explicitly started (_thread is not used).</text>
<text x="48" y="1019" font-size="16" fill="#334e68">PWM peripherals maintain pulses while the loop handles UART; this is not a second CPU thread.</text>
</g></svg>
